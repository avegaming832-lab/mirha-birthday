<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ================= CLICK HERE ================= */

#start{
  color:#ff69d9;
  font-size:46px;
  font-weight:bold;
  cursor:pointer;
  text-shadow:
    0 0 10px #ff69d9,
    0 0 30px #ff1493,
    0 0 70px #ff1493;
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.1)}
}

/* ================= POP POP ================= */

#pop{
  display:none;
  color:white;
  font-size:75px;
  font-weight:bold;
  text-shadow:
    0 0 15px white,
    0 0 40px #ff1493;
}

/* ================= BALLOONS ================= */

#balloons{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.balloon{
  position:absolute;
  bottom:-130px;

  width:52px;
  height:68px;

  border-radius:50%;

  cursor:pointer;
  pointer-events:auto;

  box-shadow:
    0 0 12px currentColor,
    0 0 25px currentColor;

  animation:balloonUp 6s linear forwards;

  transition:
    transform .15s,
    opacity .15s;
}

.balloon:hover{
  transform:scale(1.12);
}

.balloon:after{
  content:"";

  position:absolute;
  top:66px;
  left:50%;

  width:2px;
  height:110px;

  background:white;
  opacity:.45;
}

@keyframes balloonUp{

  0%{
    transform:translateY(0) rotate(0deg);
  }

  25%{
    transform:translateY(-25vh) rotate(12deg);
  }

  50%{
    transform:translateY(-55vh) rotate(-12deg);
  }

  75%{
    transform:translateY(-85vh) rotate(12deg);
  }

  100%{
    transform:translateY(-125vh) rotate(-8deg);
  }

}

/* ================= POP PARTICLES ================= */

.popParticle{
  position:fixed;

  width:8px;
  height:8px;

  border-radius:50%;

  pointer-events:none;

  animation:popParticle .7s ease-out forwards;
}

@keyframes popParticle{

  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }

  100%{
    opacity:0;
    transform:
      translate(
        calc(var(--x) * 1px),
        calc(var(--y) * 1px)
      )
      scale(.1);
  }

}

/* ================= SURPRISE ================= */

#surprise{
  display:none;

  padding:18px 32px;

  border:2px solid #ff69d9;
  border-radius:50px;

  color:white;
  background:#080808;

  font-size:23px;

  cursor:pointer;

  box-shadow:
    0 0 15px #ff69d9,
    0 0 40px #ff1493;

  animation:pulse 1s infinite alternate;
}

/* ================= 3D CAKE ================= */

#cakeScene{
  display:none;
  perspective:1200px;
}

.cake{
  width:330px;
  height:320px;

  position:relative;

  transform-style:preserve-3d;

  transform:
    rotateX(15deg)
    rotateY(-18deg);

  animation:cakeFloat 2s infinite alternate ease-in-out;
}

@keyframes cakeFloat{

  from{
    transform:
      rotateX(15deg)
      rotateY(-18deg)
      translateY(0);
  }

  to{
    transform:
      rotateX(15deg)
      rotateY(18deg)
      translateY(-12px);
  }

}

.layer{
  position:absolute;

  border-radius:22px;

  background:
    linear-gradient(
      90deg,
      #5e176f 0%,
      #a719a8 25%,
      #ff3ccf 50%,
      #ff91e8 70%,
      #8e24aa 100%
    );

  box-shadow:
    0 0 15px #ff1493,
    0 0 35px #ff1493,
    inset 0 12px 18px rgba(255,255,255,.4),
    inset 0 -18px 25px rgba(0,0,0,.3);
}

.layer1{
  width:290px;
  height:80px;
  left:20px;
  bottom:20px;
}

.layer2{
  width:245px;
  height:75px;
  left:42px;
  bottom:82px;
}

.layer3{
  width:200px;
  height:70px;
  left:65px;
  bottom:140px;
}

/* frosting */

.frosting{
  position:absolute;

  width:42px;
  height:27px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 12px white,
    0 0 25px #fff;
}

.f1{left:72px;bottom:137px}
.f2{left:120px;bottom:132px}
.f3{left:168px;bottom:138px}
.f4{left:215px;bottom:132px}

/* candle */

.candle{
  position:absolute;

  width:25px;
  height:82px;

  left:151px;
  bottom:202px;

  border-radius:8px;

  background:
    repeating-linear-gradient(
      45deg,
      white 0 8px,
      #ff69d9 8px 16px
    );

  box-shadow:
    0 0 15px #ff69d9,
    0 0 30px #ff1493;
}

/* flame */

.flame{
  position:absolute;

  width:32px;
  height:45px;

  left:-4px;
  top:-40px;

  background:#ffb300;

  border-radius:50% 50% 50% 0;

  transform:rotate(-45deg);

  box-shadow:
    0 0 15px #ff9800,
    0 0 35px #ff5722,
    0 0 60px #ff9800;

  animation:flame .4s infinite alternate;
}

@keyframes flame{

  from{
    transform:rotate(-45deg) scale(1);
  }

  to{
    transform:rotate(-40deg) scale(1.18);
  }

}

/* ================= HAPPY BIRTHDAY ================= */

#birthday{
  display:none;

  color:#ff69d9;

  font-size:70px;

  font-weight:bold;

  text-align:center;

  text-shadow:
    0 0 10px #ff69d9,
    0 0 30px #ff1493,
    0 0 70px #ff1493;

  animation:birthdayIn 1.8s ease forwards;
}

@keyframes birthdayIn{

  from{
    opacity:0;
    transform:scale(.2);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

/* ================= HEART ================= */

#heartBox{
  display:none;

  position:absolute;

  inset:0;

  justify-content:center;
  align-items:center;

  opacity:0;

  transform:scale(.5);

  transition:
    opacity 1.5s ease,
    transform 1.5s cubic-bezier(.17,.67,.3,1.3);
}

#heartSvg{
  width:min(85vw,850px);
  height:min(80vh,700px);

  overflow:visible;
}

.heartText{
  fill:#ff69d9;

  font-size:21px;

  font-weight:bold;

  letter-spacing:1px;

  filter:url(#glow);
}

/* mobile */

@media(max-width:600px){

  #start{
    font-size:32px;
  }

  #pop{
    font-size:50px;
  }

  #birthday{
    font-size:38px;
  }

  #surprise{
    font-size:18px;
  }

  .heartText{
    font-size:16px;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- CLICK HERE -->
  <div id="start">
    CLICK HERE 💗
  </div>

  <!-- POP POP -->
  <div id="pop">
    POP POP 🎈
  </div>

  <!-- BALLOONS -->
  <div id="balloons"></div>

  <!-- SURPRISE -->
  <div id="surprise">
    Click here for a surprise ✨
  </div>

  <!-- 3D CAKE -->
  <div id="cakeScene">

    <div class="cake">

      <div class="layer layer1"></div>
      <div class="layer layer2"></div>
      <div class="layer layer3"></div>

      <div class="frosting f1"></div>
      <div class="frosting f2"></div>
      <div class="frosting f3"></div>
      <div class="frosting f4"></div>

      <div class="candle">

        <div
          class="flame"
          id="flame">
        </div>

      </div>

    </div>

  </div>

  <!-- HAPPY BIRTHDAY -->
  <div id="birthday">
    HAPPY BIRTHDAY MIRHAA
  </div>

  <!-- HEART -->
  <div id="heartBox">

    <svg
      id="heartSvg"
      viewBox="0 0 900 700"
      xmlns="http://www.w3.org/2000/svg">

      <defs>

        <filter id="glow">

          <feGaussianBlur
            stdDeviation="3"
            result="blur"/>

          <feMerge>

            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>

          </feMerge>

        </filter>

        <path
          id="heartPath"
          d="
          M450 620
          C390 560 100 400 100 215
          C100 85 260 45 365 150
          C410 195 450 245 450 245
          C450 245 490 195 535 150
          C640 45 800 85 800 215
          C800 400 510 560 450 620
          Z
          "
        />

      </defs>

      <!-- TEXT ITSELF MAKES HEART BORDER -->

      <text class="heartText">

        <textPath
          href="#heartPath"
          startOffset="0%">

          happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa • happy birthday mirhaa •

        </textPath>

      </text>

    </svg>

  </div>

</div>


<script>

const start =
  document.getElementById("start");

const pop =
  document.getElementById("pop");

const balloons =
  document.getElementById("balloons");

const surprise =
  document.getElementById("surprise");

const cakeScene =
  document.getElementById("cakeScene");

const flame =
  document.getElementById("flame");

const birthday =
  document.getElementById("birthday");

const heartBox =
  document.getElementById("heartBox");


const colors = [

  "#ff1744",
  "#ff4081",
  "#7c4dff",
  "#00e5ff",
  "#00e676",
  "#ffea00",
  "#ff9100",
  "#e040fb",
  "#ff1493",
  "#00ffff"

];


/* =================================
   START
================================= */

start.onclick = function(){

  start.style.display="none";

  pop.style.display="block";

  setTimeout(function(){

    pop.style.display="none";

    createBalloons();

  },900);

};


/* =================================
   150 BALLOONS
================================= */

function createBalloons(){

  for(let i=0;i<150;i++){

    const balloon =
      document.createElement("div");

    balloon.className="balloon";

    balloon.style.left =
      (Math.random()*97)+"%";

    balloon.style.background =
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    balloon.style.color =
      balloon.style.background;

    balloon.style.animationDelay =
      (Math.random()*4)+"s";

    balloon.style.width =
      (35+Math.random()*35)+"px";

    balloon.style.height =
      (48+Math.random()*45)+"px";


    /* CLICK = POP */

    balloon.addEventListener(
      "click",
      function(e){

        e.stopPropagation();

        popBalloon(balloon);

      }
    );


    balloons.appendChild(balloon);

  }


  /* SURPRISE BUTTON */

  setTimeout(function(){

    surprise.style.display="block";

  },4500);

}


/* =================================
   BALLOON POP + SOUND
================================= */

function popBalloon(balloon){

  /*
    Create POP sound with Web Audio.
    No external sound file needed.
  */

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.type="sawtooth";

    oscillator.frequency.setValueAtTime(
      180,
      audio.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      40,
      audio.currentTime + 0.12
    );

    gain.gain.setValueAtTime(
      0.35,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.15
    );

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.15
    );

  }catch(error){

    console.log("Audio unavailable");

  }


  /* BALLOON POSITION */

  const rect =
    balloon.getBoundingClientRect();

  const x =
    rect.left +
    rect.width / 2;

  const y =
    rect.top +
    rect.height / 2;


  /* HIDE BALLOON */

  balloon.style.animation="none";

  balloon.style.transform="scale(0)";

  balloon.style.opacity="0";


  /* POP PARTICLES */

  for(let i=0;i<15;i++){

    const particle =
      document.createElement("div");

    particle.className="popParticle";

    particle.style.left=x+"px";

    particle.style.top=y+"px";

    particle.style.background =
      balloon.style.background;

    particle.style.setProperty(
      "--x",
      Math.random()*180-90
    );

    particle.style.setProperty(
      "--y",
      Math.random()*180-90
    );

    document.body.appendChild(
      particle
    );


    setTimeout(function(){

      particle.remove();

    },700);

  }


  setTimeout(function(){

    balloon.remove();

  },150);

}


/* =================================
   SURPRISE
================================= */

surprise.onclick=function(){

  surprise.style.display="none";

  balloons.style.display="none";

  cakeScene.style.display="flex";


  /* CANDLE FOR 3 SECONDS */

  setTimeout(function(){

    flame.style.display="none";


    setTimeout(function(){

      cakeScene.style.display="none";


      /* HAPPY BIRTHDAY */

      birthday.style.display="block";


      setTimeout(function(){

        birthday.style.display="none";

        showHeart();

      },3000);

    },500);

  },3000);

};


/* =================================
   HEART
================================= */

function showHeart(){

  heartBox.style.display="flex";

  setTimeout(function(){

    heartBox.style.opacity="1";

    heartBox.style.transform="scale(1)";

  },100);

}

</script>

</body>
</html>
